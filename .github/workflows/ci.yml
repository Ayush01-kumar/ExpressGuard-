name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        express: ['4.21.2', '5.1.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm pkg set devDependencies.express=${{ matrix.express }}
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run lint
      - run: npm run check
      - run: npm pack --dry-run
